<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapEdit</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 250px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
    }
    
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-capture {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .btn-capture:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .btn-capture:active {
      transform: translateY(0);
    }

    .logo-icon {
        width: 20px;
        height: 20px;
        background-color: white; /* Placeholder if no icon img yet */
        border-radius: 4px;
        mask-image: url('icons/icon48.png');
        mask-size: contain;
        mask-repeat: no-repeat;
        -webkit-mask-image: url('icons/icon48.png');
        -webkit-mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        background-color: currentColor;
    }
  </style>
</head>
<body>
  <h1>
    <span>SnapEdit</span>
  </h1>
  <button id="captureBtn" class="btn-capture">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    Capture Page
  </button>
  <script src="popup.js"></script>
</body>
</html>
